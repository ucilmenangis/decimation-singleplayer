/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    // Decimation itself (closed source). libs/Decimation-base.jar = Decimation.jar.patched
    // minus our own net/decimation/{worldgen,fixes} classes; RFG remaps it SRG -> MCP.
    // With -Pangelica: a copy without the fastutil Decimation bundles (unused by it: no class in
    // the jar references it) because GTNHLib needs a newer fastutil (docs/performance.md).
    devOnlyNonPublishable(rfg.deobf(project.files(project.hasProperty("angelica")
        ? "libs/Decimation-base-nofastutil.jar" : "libs/Decimation-base.jar")))
}

// Decimation's main menu swaps "Play" for "Update" unless mods/DecimationVoiceChat.jar
// exists (net.decimation.mod.common.utils.h.gI()). Install a deobfuscated copy of the
// real voice chat jar into the dev run folder so the dev menu behaves like Prism.
configurations {
    voiceChatDeobf
}
dependencies {
    voiceChatDeobf(rfg.deobf(project.files("libs/DecimationVoiceChat.jar")))
}
def installVoiceChat = tasks.register("installVoiceChat", Copy) {
    from(configurations.voiceChatDeobf)
    into(layout.projectDirectory.dir("run/client/mods"))
    rename { "DecimationVoiceChat.jar" }
}
tasks.matching { it.name == "runClient" }.configureEach {
    dependsOn(installVoiceChat)
}

// `gradlew runClient -Photswap`: debug agent on port 5005 so changed classes
// can be pushed into the running game (tools/hotswap.py), no restart
tasks.matching { it.name == "runClient" }.configureEach {
    if (project.hasProperty("hotswap")) {
        jvmArgs("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005")
    }
}

// `gradlew runClient -Plive`: the game stays open and takes test runs over
// 127.0.0.1:25599 (devtest/DevTestLive; tools/devtest.py --live), with the
// hotswap debug port too, so code changes in method bodies need no restart
tasks.matching { it.name == "runClient" }.configureEach {
    if (project.hasProperty("live")) {
        jvmArgs("-Ddeciworldgen.autotest=true", "-Ddeciworldgen.autotest.live=true")
        if (!project.hasProperty("hotswap")) {
            jvmArgs("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005")
        }
    }
}

// `gradlew runClient -Pdevtest=checks,scope,tracer` runs those dev test modes
// in one game session (package worldgen.devtest; tools/devtest.py wraps it):
// checks, views, scope, tracer, props, cityfps. Results: run/client/devtest/results.txt
tasks.matching { it.name == "runClient" }.configureEach {
    if (project.hasProperty("devtest")) {
        jvmArgs("-Ddeciworldgen.autotest=true", "-Ddeciworldgen.autotest.test=" + project.property("devtest"))
    }
}

// `gradlew runClient -Pautotest` runs the unattended singleplayer smoke test
// (net.decimation.worldgen.DevAutoTest) and quits the game when done.
tasks.matching { it.name == "runClient" }.configureEach {
    if (project.hasProperty("autotest")) {
        jvmArgs("-Ddeciworldgen.autotest=true")
    }
    // -Paudit: screenshots inside sample buildings instead of the street views
    if (project.hasProperty("audit")) {
        jvmArgs("-Ddeciworldgen.autotest.audit=true")
    }
    // -Pgallery: every Decimation block photographed 5 at a time
    if (project.hasProperty("gallery")) {
        jvmArgs("-Ddeciworldgen.autotest.gallery=true")
    }
    // -Pfootprint: top down shots of every prop, empty then placed (footprint_<n>.png)
    if (project.hasProperty("footprint")) {
        jvmArgs("-Ddeciworldgen.autotest.footprint=true")
    }
    // -Pstudy=<save>|<cams.tsv>: photograph a copied reference map (study_<n>.png)
    if (project.hasProperty("study")) {
        jvmArgs("-Ddeciworldgen.autotest.study=" + project.property("study"))
    }
    // -Pscope: fps with a 4x scoped gun held / aimed, fov zoom, scope_<mode>.png
    if (project.hasProperty("scope")) {
        jvmArgs("-Ddeciworldgen.autotest.scope=true")
    }
    // -Pjfr: Java Flight Recorder CPU samples of the whole run (run/client/profile.jfr)
    if (project.hasProperty("jfr")) {
        jvmArgs("-XX:+UnlockCommercialFeatures", "-XX:+FlightRecorder",
                "-XX:StartFlightRecording=filename=profile.jfr,settings=profile,dumponexit=true")
    }
    // -Pcityfps: fps looking down a city street (last autotest world)
    if (project.hasProperty("cityfps")) {
        jvmArgs("-Ddeciworldgen.autotest.cityfps=true")
    }
    // -Pprops: fps with many props in view / hidden (last autotest world)
    if (project.hasProperty("props")) {
        jvmArgs("-Ddeciworldgen.autotest.props=true")
    }
    // -Ptracer: NPC tracer direction test alone in the last autotest world
    if (project.hasProperty("tracer")) {
        jvmArgs("-Ddeciworldgen.autotest.tracer=true")
    }
    // -Pscopeonly: the scope test alone in the last autotest world (no new world, no server checks)
    if (project.hasProperty("scopeonly")) {
        jvmArgs("-Ddeciworldgen.autotest.scopeonly=true")
    }
    // -Pflats: interiors of 3 apartment blocks (flat_<n>.png)
    if (project.hasProperty("flats")) {
        jvmArgs("-Ddeciworldgen.autotest.flats=true")
    }
    // -Psets: every furniture set staged in a bay and photographed (set_<n>.png)
    if (project.hasProperty("sets")) {
        jvmArgs("-Ddeciworldgen.autotest.sets=true")
    }
    // -Ponly=0,23,70-76: re-shoot only these views
    if (project.hasProperty("only")) {
        jvmArgs("-Ddeciworldgen.autotest.only=" + project.property("only"))
    }
}

// `gradlew runServer -Ppregen=x,z,radiusChunks` generates that area on start
// (net.decimation.worldgen.DevPregen) so large structures can be checked.
tasks.matching { it.name == "runServer" }.configureEach {
    if (project.hasProperty("pregen")) {
        jvmArgs("-Ddeciworldgen.pregen=" + project.property("pregen"))
    }
    if (project.hasProperty("debugsets")) {
        jvmArgs("-Ddeciworldgen.debugsets=true")
    }
}

// `gradlew runClient -Pangelica -PforceEnableMixins=true` (or tools/devtest.py --live --angelica):
// Angelica, the GTNH rendering overhaul (Sodium style chunk meshing, modern GL), in the dev
// client only, to measure it against the plain renderer (docs/performance.md). Never in the
// release jar (runtime only, not published). Angelica brings its mixins: forceEnableMixins.
if (project.hasProperty("angelica")) {
    dependencies {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.2.30:dev")
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.11.52:dev")
    }
}

